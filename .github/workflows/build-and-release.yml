name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MarkdownView ${{ github.ref_name }}
          releaseBody: '## MarkdownView ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Create Windows Portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "MarkdownView-${version}-windows-x64-portable.zip"
          $sourceDir = "src-tauri/target/release"
          $zipPath = Join-Path $sourceDir $zipName

          Compress-Archive -Path "$sourceDir/markdown-view.exe" -DestinationPath $zipPath -Force

          if (Test-Path $zipPath) {
            Write-Host "Created $zipName"
          } else {
            Write-Error "Failed to create zip"
            exit 1
          }

      - name: Upload portable ZIP to release
        if: matrix.platform == 'windows-latest'
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "MarkdownView-${version}-windows-x64-portable.zip"
          $zipPath = "src-tauri/target/release/$zipName"

          if (!(Test-Path $zipPath)) {
            Write-Error "ZIP not found: $zipPath"
            exit 1
          }

          Write-Host "Uploading $zipName..."
          gh release upload $version $zipPath --repo "${{ github.repository }}" --clobber
          Write-Host "Exit code: $LASTEXITCODE"
